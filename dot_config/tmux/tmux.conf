unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on
set -g detach-on-destroy off

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g set-titles on
set-option -g set-titles-string "#(echo #{pane_current_path} | sed 's#$HOME#~#g')"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Agent status rollup (Claude Code / Codex hooks write per-pane state)
set -g status-interval 5

# Plugin options (must be set before run-shell)
set -g @rose_pine_variant 'dawn'
set -g @rose_pine_status_right_prepend_section '#(~/.config/tmux/scripts/agent_status.sh #{session_name})'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
bind f display-popup -w 80 -h 30 -y 15 -E '$HOME/.config/tmux/scripts/session_switcher.sh'

# Plugins (managed by chezmoi externals)
run-shell ~/.config/tmux/plugins/tmux-sensible/sensible.tmux
# Runs rose-pine, then appends the agent-status window label onto its
# window-status-format — see agent_status_theme.sh for why this can't be a
# separate run-shell line after rose-pine's.
run-shell ~/.config/tmux/scripts/agent_status_theme.sh
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
